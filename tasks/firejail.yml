---
- name: Firefox in firejail
  block:

    - name: Run apt-cache policy
      ansible.builtin.command: apt-cache policy
      check_mode: false
      changed_when: false
      register: firefox_apt_cache_policy

    - name: Packages present from backports
      ansible.builtin.apt:
        pkg:
          - firejail
          - firejail-profiles
        state: latest
        update_cache: true
        cache_valid_time: 0
        default_release: "{{ ansible_facts.distribution_release }}-backports"
      when: firefox_backports in firefox_apt_cache_policy.stdout

    - name: Packages present
      ansible.builtin.apt:
        pkg:
          - firejail
          - firejail-profiles
        update_cache: true
        cache_valid_time: 30
      when: firefox_backports not in firefox_apt_cache_policy.stdout

    - name: Set a fact for the firejain config options as defined in the arg spec
      ansible.builtin.set_fact:
        firefox_firejail_argument_spec: "{{ (lookup('ansible.builtin.file', 'meta/argument_specs.yml') | ansible.builtin.from_yaml).argument_specs.main.options.firefox_firejail_default_config.options }}"

    - name: Debug firefox_firejail_argument_spec
      ansible.builtin.debug:
        var: firefox_firejail_argument_spec
        # verbosity: "{% if ansible_check_mode | bool %}3{% else %}4{% endif %}"
      tags:
        - debug

    - name: Set a fact for the firejail config
      ansible.builtin.set_fact:
        firefox_firejail_cfg: "{{ firefox_firejail_default_config | ansible.builtin.combine(firefox_firejail_config) }}"

    - name: Debug firefox_firejail_cfg
      ansible.builtin.debug:
        var: firefox_firejail_cfg
        # verbosity: "{% if ansible_check_mode | bool or ansible_diff_mode | bool %}0{% else %}1{% endif %}"
      tags:
        - debug

    - name: Check the combined firejail config using the argument spec
      ansible.builtin.validate_argument_spec:
        argument_spec: "{{ firefox_firejail_argument_spec }}"
        provided_arguments: "{{ firefox_firejail_cfg }}"

    - name: Firejail config present
      ansible.builtin.template:
        src: firejail.config.j2
        dest: /etc/firejail/firejail.config
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Firejail users configured
      ansible.builtin.template:
        src: firejail.users.j2
        dest: /etc/firejail/firejail.users
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Firefix profiles present
      ansible.builtin.template:
        src: firefox.profile.j2
        dest: "/etc/firejail/{{ firefox_edition.pkg }}.profile"
        backup: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ firefox_editions }}"
      loop_control:
        loop_var: firefox_edition
        label: "{{ firefox_edition.pkg }}"

    - name: Firefox firejail local profiles present
      ansible.builtin.template:
        src: firefox.local.j2
        dest: "/etc/firejail/{{ firefox_edition.pkg }}.local"
        backup: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ firefox_editions }}"
      loop_control:
        loop_var: firefox_edition
        label: "{{ firefox_edition.pkg }}"

    - name: Firefox script in place
      ansible.builtin.template:
        src: firefox.sh.j2
        dest: "/usr/local/bin/{{ firefox_edition.pkg }}"
        mode: "0755"
        owner: root
        group: root
      loop: "{{ firefox_editions }}"
      loop_control:
        loop_var: firefox_edition
        label: "{{ firefox_edition.pkg }}"

    - name: Include Firefox desktop file tasks
      ansible.builtin.include_tasks: desktop.yml
      loop: "{{ firefox_editions }}"
      loop_control:
        loop_var: firefox_edition
        label: "{{ firefox_edition.pkg }}"

  tags:
    - firefox
...
