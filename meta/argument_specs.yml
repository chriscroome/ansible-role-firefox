      firefox_firejail_users:
        type: list
        elements: str
        required: true
        description: A list of users for /etc/firejail/firejail.users.
      firefox_gpg_checksum:
        type: str
        required: true
        description: Internal Firefox GPG checksum.
      firefox_gpg_checksum_raw:
